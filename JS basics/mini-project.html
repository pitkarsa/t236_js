<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="	https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>

<body>
    <div class="row">
        <div class="col-4 mx-auto border rounded shadow mt-4">
            <h3>Conversion of currency </h3>
            <form class="p-3">
                <div class="mb-3">
                    <label class="form-label">Amount</label>
                    <input type="text" class="form-control" id="amount">
                </div>
                <div class="mb-3">
                    <label class="form-label">From</label>
                    <select class="form-select" id="from">
                        <option selected>Select the From Country</option>
                        <option value="INR">India</option>
                        <option value="USD">America</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">To</label>
                    <select class="form-select" id="to">
                        <option selected>Select the To Country</option>
                        <option value="INR">India</option>
                        <option value="USD">America</option>
                    </select>
                </div>
                <button  class="btn btn-primary" onclick="convert(event)" id="convert_btn">Convert</button>
            </form>
        </div>
    </div>
    <script>
        function convert(event){
            event.preventDefault(); // to prevent the default behavior of the form submission/ reloading the form
            // 1. capture user i/p
            const amount = +document.getElementById("amount").value;
            const from = document.getElementById("from").value;
            const to = document.getElementById("to").value;
            console.log(amount, from, to);

            // 2. capture the conversion rate
            fetch(`https://api.exchangerate-api.com/v4/latest/${from}`)
            .then(resp => resp.json())
            .then(data => {
                console.log(data); 
                const rates = data.rates; 
                console.log(rates);
                // const coversionRate = rates.INR;
                const coversionRate = rates[to];
                console.log(coversionRate);
                
                // conversion
                const convertedAmount = amount*coversionRate;
                //alert("Converted amount = "+convertedAmount);

                const element = document.createElement("h2");
                element.innerText = "Converted amount is "+convertedAmount;
                element.style.color="blue";

                const button  = document.getElementById("convert_btn");
               button.after(element);             
            })
            .catch(err => console.error(err));


        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
