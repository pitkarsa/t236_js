<body>
    <h1>Learning JS</h1>
    <p>JS is a front end programming language.
        it is used for making the web pages dynamic
    </p>
    <script>
        var username = "Amit"; // var is old keyword for declaring variable
        let age = 20; // let is from ES6 , used for declaring variables
        console.log(username);
        console.log(age);

        const surname = "Patil"; // const is from ES6, used for declaring constant
        console.log(surname);

        // updations
        
        age = 22;
        console.log(age);
        // surname = "Shah"; // updation not allowed, as it is constant
        console.log(surname);
        

        // single line comment
